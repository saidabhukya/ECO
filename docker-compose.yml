version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ecotrack-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: eco_track
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: ecotrack-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/eco_track
      - JWT_SECRET=eco_track_production_super_secret_jwt_key_987654321
      - JWT_EXPIRE=7d
      - CLIENT_URL=http://localhost:5173
      - COMPANY_NAME=ECO TRACK
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: ecotrack-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
